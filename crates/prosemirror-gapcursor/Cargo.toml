[package]
name = "prosemirror-gapcursor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ProseMirror gap cursor selections and editor hooks"

[features]
browser = [
    "dep:wasm-bindgen",
    "dep:web-sys",
    "prosemirror-view/browser",
]
browser-tests = [
    "browser",
    "dep:wasm-bindgen-test",
    "web-sys/CssStyleDeclaration",
    "web-sys/InputEventInit",
    "web-sys/KeyboardEventInit",
    "web-sys/MouseEventInit",
    "web-sys/Window",
]

[dependencies]
prosemirror-keymap = { path = "../prosemirror-keymap" }
prosemirror-model.workspace = true
prosemirror-state.workspace = true
prosemirror-view.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { optional = true, version = "0.3", features = ["Document", "Element", "InputEvent", "KeyboardEvent", "MouseEvent", "console"] }
wasm-bindgen-test = { version = "0.3", optional = true }

[dev-dependencies]
prosemirror-schema-basic.workspace = true
prosemirror-transform.workspace = true

[[test]]
name = "browser"
required-features = ["browser-tests"]
