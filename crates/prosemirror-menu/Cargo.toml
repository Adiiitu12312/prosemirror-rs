[package]
name = "prosemirror-menu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native and browser menus and toolbar controls for the ProseMirror editor"

[features]
browser = [
    "dep:js-sys",
    "dep:prosemirror-view",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "prosemirror-view/browser",
]
browser-tests = [
    "browser",
    "dep:wasm-bindgen-test",
]

[dependencies]
prosemirror-model.workspace = true
prosemirror-state.workspace = true
prosemirror-commands.workspace = true
prosemirror-history.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
prosemirror-test-builder.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
prosemirror-view = { workspace = true, optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { optional = true, version = "0.3", features = [
    "CssStyleDeclaration", "Document", "DomRect", "DomRectList", "DomTokenList",
    "Element", "Event", "EventTarget", "FocusEvent", "HtmlElement", "KeyboardEvent",
    "KeyboardEventInit", "MouseEvent", "MouseEventInit", "Navigator", "Node",
    "Range", "Selection", "ShadowRoot", "ShadowRootInit", "ShadowRootMode", "UiEvent", "Window", "console",
] }
wasm-bindgen-test = { version = "0.3", optional = true }

[[test]]
name = "browser"
required-features = ["browser-tests"]
