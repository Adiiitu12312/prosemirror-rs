[package]
name = "prosemirror-example-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Example editor bindings and plugin setup for ProseMirror"

[features]
browser = [
    "dep:js-sys",
    "dep:prosemirror-view",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "prosemirror-dropcursor/browser",
    "prosemirror-gapcursor/browser",
    "prosemirror-keymap/browser",
    "prosemirror-menu/browser",
    "prosemirror-view/browser",
]
browser-tests = [
    "browser",
    "dep:wasm-bindgen-test",
]

[dependencies]
prosemirror-commands.workspace = true
prosemirror-dropcursor.workspace = true
prosemirror-gapcursor.workspace = true
prosemirror-history.workspace = true
prosemirror-inputrules.workspace = true
prosemirror-keymap.workspace = true
prosemirror-menu.workspace = true
prosemirror-model.workspace = true
prosemirror-schema-list.workspace = true
prosemirror-state.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
prosemirror-view = { workspace = true, optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { optional = true, version = "0.3", features = [
    "CssStyleDeclaration", "Document", "DomRect", "Element", "Event", "EventInit", "EventTarget", "HtmlElement",
    "HtmlInputElement", "HtmlOptionElement", "HtmlSelectElement", "KeyboardEvent",
    "KeyboardEventInit", "MouseEvent", "Node", "Window", "console",
] }
wasm-bindgen-test = { version = "0.3", optional = true }

[dev-dependencies]
prosemirror-test-builder.workspace = true

[[test]]
name = "browser"
required-features = ["browser-tests"]
