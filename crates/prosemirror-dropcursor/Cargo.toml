[package]
name = "prosemirror-dropcursor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ProseMirror drop cursor for native and browser editor hosts"

[features]
browser = [
    "dep:js-sys",
    "dep:prosemirror-state",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "prosemirror-view/browser",
]
browser-tests = [
    "browser",
    "dep:wasm-bindgen-test",
    "web-sys/DataTransfer",
    "web-sys/DragEventInit",
]

[dependencies]
prosemirror-model.workspace = true
prosemirror-transform.workspace = true
prosemirror-view.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
prosemirror-state = { workspace = true, optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { optional = true, version = "0.3", features = ["CssStyleDeclaration", "Document", "DomRect", "DomTokenList", "DragEvent", "Element", "Event", "EventTarget", "HtmlElement", "MouseEvent", "Node", "Window", "console"] }
wasm-bindgen-test = { version = "0.3", optional = true }

[dev-dependencies]
prosemirror-schema-basic.workspace = true
serde_json.workspace = true

[[test]]
name = "browser"
required-features = ["browser-tests"]
