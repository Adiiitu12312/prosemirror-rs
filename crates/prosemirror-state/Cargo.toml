[package]
name = "prosemirror-state"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pure Rust editor state, selections, transactions, and plugins matching ProseMirror"

[dependencies]
prosemirror-model = { workspace = true }
prosemirror-transform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
prosemirror-test-builder = { path = "../prosemirror-test-builder" }
