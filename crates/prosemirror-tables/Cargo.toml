[package]
name = "prosemirror-tables"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Table schema and grid mapping for ProseMirror documents"

[dependencies]
prosemirror-model.workspace = true
prosemirror-state.workspace = true
prosemirror-view.workspace = true
prosemirror-transform.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
prosemirror-keymap.workspace = true
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration", "Document", "DomRect", "Element", "Event", "EventTarget",
    "HtmlElement", "KeyboardEvent", "MouseEvent", "Node", "NodeList", "UiEvent", "Window", "console",
] }

[dev-dependencies]
prosemirror-schema-basic.workspace = true
prosemirror-test-builder.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["KeyboardEventInit", "MouseEventInit"] }
