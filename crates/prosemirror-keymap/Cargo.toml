[package]
name = "prosemirror-keymap"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ProseMirror keyboard bindings for native and web editor integrations"

[dependencies]
prosemirror-state.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
prosemirror-view.workspace = true
web-sys = { version = "0.3", features = ["Document", "KeyboardEvent", "Navigator", "Window"] }

[dev-dependencies]
prosemirror-schema-basic.workspace = true
