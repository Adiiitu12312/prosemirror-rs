[workspace]
resolver = "2"
members = [
    "crates/prosemirror-model",
    "crates/prosemirror-transform",
    "crates/prosemirror-state",
    "crates/prosemirror-history",
    "crates/prosemirror-collab",
    "crates/prosemirror-keymap",
    "crates/prosemirror-inputrules",
    "crates/prosemirror-gapcursor",
    "crates/prosemirror-dropcursor",
    "crates/prosemirror-tables",
    "crates/prosemirror-changeset",
    "crates/prosemirror-markdown",
    "crates/prosemirror-search",
    "crates/prosemirror-example-setup",
    "crates/prosemirror-commands",
    "crates/prosemirror-schema-basic",
    "crates/prosemirror-schema-list",
    "crates/prosemirror-test-builder",
    "crates/prosemirror-view",
    "crates/prosemirror-fuzz",
    "crates/prosemirror-integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/prosemirror-rs/prosemirror-rs"
authors = ["prosemirror-rs contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-segmentation = "1.12"
smallvec = { version = "1.13", features = ["serde"] }
prosemirror-model = { path = "crates/prosemirror-model" }
prosemirror-transform = { path = "crates/prosemirror-transform" }
prosemirror-state = { path = "crates/prosemirror-state" }
prosemirror-history = { path = "crates/prosemirror-history" }
prosemirror-commands = { path = "crates/prosemirror-commands" }
prosemirror-dropcursor = { path = "crates/prosemirror-dropcursor" }
prosemirror-gapcursor = { path = "crates/prosemirror-gapcursor" }
prosemirror-inputrules = { path = "crates/prosemirror-inputrules" }
prosemirror-keymap = { path = "crates/prosemirror-keymap" }
prosemirror-schema-basic = { path = "crates/prosemirror-schema-basic" }
prosemirror-schema-list = { path = "crates/prosemirror-schema-list" }
prosemirror-test-builder = { path = "crates/prosemirror-test-builder" }
prosemirror-view = { path = "crates/prosemirror-view" }
