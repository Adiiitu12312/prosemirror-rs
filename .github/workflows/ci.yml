name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "codex/prosemirror-parity" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    # Run differential fuzzing continuously every night
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Oracle dependencies
        run: npm ci

      - name: Run Node Oracle Tests
        run: npm test

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Run Test Suite
        run: cargo test --workspace --all-targets --no-fail-fast

      - name: Run Documentation Tests
        run: cargo test --workspace --doc

      - name: Run ProseMirror Differential Fuzzer
        id: fuzz
        run: cargo run --bin prosemirror-fuzz -- --iterations 200 --oracle oracle/server.js

      - name: Save Differential Fuzzer Failure
        if: ${{ failure() && steps.fuzz.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.os }}
          path: repro_case_*.json
          if-no-files-found: ignore

      - name: Cargo Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

  browser:
    name: Browser view (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: taiki-e/install-action@wasm-pack

      - name: Check the browser view
        run: cargo clippy -p prosemirror-view --target wasm32-unknown-unknown --test browser -- -D warnings

      - name: Run the Rust browser tests
        if: ${{ !cancelled() }}
        run: |
          if [[ -n "$CHROMEWEBDRIVER" ]]; then
            export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          fi
          wasm-pack test --headless --chrome crates/prosemirror-view --test browser
