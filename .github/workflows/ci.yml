name: CI Pipeline

on:
  push:
    branches: [ "main", "codex/native-*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # Run differential fuzzing continuously every night
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Oracle dependencies
        run: npm ci

      - name: Run Node Oracle Tests
        run: npm test

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Run Test Suite
        run: cargo test --workspace --all-targets --no-fail-fast

      - name: Capture native editor screenshots
        shell: bash
        run: |
          mkdir -p screenshots
          cargo run --bin editor-app -- --snapshot screenshots/editor.png
          for scenario in typing selection block_drag; do
            cargo run --bin editor-app -- --replay "examples/editor-app/tests/fixtures/${scenario}.json" --png "screenshots/${scenario}.png"
          done

      - name: Save native editor screenshots
        uses: actions/upload-artifact@v4
        with:
          name: editor-screenshots-${{ matrix.os }}
          path: screenshots/*.png
          if-no-files-found: error

      - name: Measure native editor workloads
        if: matrix.os == 'ubuntu-latest' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --bin editor-app
          target/release/editor-app --bench core | tee editor-benchmarks.jsonl
          target/release/editor-app --bench surface | tee -a editor-benchmarks.jsonl

      - name: Save editor benchmark measurements
        if: matrix.os == 'ubuntu-latest' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: editor-benchmarks
          path: editor-benchmarks.jsonl
          if-no-files-found: error

      - name: Run Documentation Tests
        run: cargo test --workspace --doc

      - name: Run ProseMirror Differential Fuzzer
        id: fuzz
        run: cargo run --bin prosemirror-fuzz -- --iterations 200 --oracle oracle/server.js

      - name: Save Differential Fuzzer Failure
        if: ${{ failure() && steps.fuzz.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.os }}
          path: repro_case_*.json
          if-no-files-found: ignore

      - name: Cargo Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

  browser:
    name: Browser view (${{ matrix.browser }})
    runs-on: ubuntu-latest
    env:
      BROWSER_TEST_PACKAGES: >-
        prosemirror-view
        prosemirror-gapcursor
        prosemirror-dropcursor
        prosemirror-menu
        prosemirror-example-setup
        prosemirror-tables
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: taiki-e/install-action@wasm-pack

      - name: Check the browser view
        if: matrix.browser == 'chrome'
        run: |
          read -r -a packages <<< "$BROWSER_TEST_PACKAGES"
          package_args=()
          for package in "${packages[@]}"; do
            package_args+=(-p "$package")
          done
          cargo clippy "${package_args[@]}" --target wasm32-unknown-unknown --features browser-tests --test browser -- -D warnings

      - name: Run the Rust browser tests
        if: ${{ !cancelled() }}
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: |
          case "$TEST_BROWSER" in
            chrome)
              if [[ -n "$CHROMEWEBDRIVER" ]]; then
                export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
              fi
              ;;
            firefox)
              if [[ -n "$GECKOWEBDRIVER" ]]; then
                export GECKODRIVER="$GECKOWEBDRIVER/geckodriver"
              fi
              export WASM_BINDGEN_TEST_WEBDRIVER_JSON="$RUNNER_TEMP/firefox.json"
              printf '%s\n' '{"moz:firefoxOptions":{"prefs":{"focusmanager.testmode":true}}}' > "$WASM_BINDGEN_TEST_WEBDRIVER_JSON"
              ;;
          esac
          read -r -a packages <<< "$BROWSER_TEST_PACKAGES"
          result=0
          for package in "${packages[@]}"; do
            wasm-pack test --headless "--$TEST_BROWSER" "crates/$package" --test browser --features browser-tests || result=1
          done
          exit "$result"

  native-dependencies:
    name: Default dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify browser code is opt-in on all targets
        run: |
          for target in x86_64-unknown-linux-gnu wasm32-unknown-unknown; do
            graph=$(cargo tree --workspace --target "$target" --prefix none)
            if grep -Eq '^(wasm-bindgen(-[^ ]+)?|web-sys|js-sys) ' <<< "$graph"; then
              echo "Default dependencies contain a browser dependency on $target"
              exit 1
            fi
          done
